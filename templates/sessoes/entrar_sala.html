<!DOCTYPE html>
{% load static %}
{% load i18n %}
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="{% static 'img/d20hub.ico' %}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/sala_rpg.css' %}?v=1.32">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Entrar em uma Sala</title>
</head>
<body>
    <div class="toolbar">
        <a href="{% url 'core:home' %}" id="retornar"><i class="bi bi-arrow-left"></i> Voltar ao Menu</a>
        <h1>Entrar em uma Sala</h1>
    </div>
    <form id="form-entrar" method="POST" action="{% url 'sessoes:entrar_sala' %}">
        {% csrf_token %}
        <label for="id_codigo">Código da Sala:</label>
        
        <input 
            id="id_codigo" 
            name="codigo" 
            placeholder="Ex: A8F3K" 
            required 
            maxlength="6"
            autocomplete="off"
            oninput="this.value = this.value.toUpperCase()"
        >
        
        <button id="entrar-sala" type="submit"><i class="bi-box-arrow-in-right"></i> Entrar na Mesa</button>
    </form>
</body>
</html>
