{% load i18n %}
<div class="modal-content">
    <div class="modal-header">
        <h2>Selecionar Ficha</h2>
    </div>

    <div class="modal-body">
        {% if fichas %}
            <div class="ficha-list">
                {% for id, nome in fichas %}
                    <div class="ficha-item" data-ficha-id="{{ id }}">
                        <span class="ficha-nome">{{ nome }}</span>
                    </div>
                {% endfor %}
            </div>
        {% else %}
            <p>Você não possui fichas válidas para serem selecionadas.</p>
        {% endif %}
    </div>
</div>
