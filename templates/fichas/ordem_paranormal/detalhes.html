<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% load static %}
  <link rel="icon" type="image/x-icon" href="{% static 'img/d20hub.ico' %}">
  <title>D20HUB</title>

  <!--bootstrap css-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  
  <!--bootstrap icons-->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <!--arquivo css-->
  <link rel="stylesheet" href="{% static 'css/ficha.css' %}?v=1.1">

  <!--bootstrap javascript-->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

  <!--javascript ficha-->
  <script src="{% static 'js/ficha.js' %}?v=1.2" defer></script>  
  
  
  <script>
    window.csrftoken = '{{ csrf_token }}';
  </script>
</head>

<body>
  <div class="sheet" data-id="{{ ficha.id }}">
    <header>
      <div style="margin-bottom: 10px; text-align: center;">
        <a class="btn btn-outline-primary" href="{% url 'fichas:ler' ficha.id 'ficha' %}">Ficha</a>
        <a class="btn btn-outline-primary" href="{% url 'fichas:ler' ficha.id 'pericias' %}">Pericias</a>
        <a class="btn btn-outline-primary" href="{% url 'fichas:ler' ficha.id 'habilidades' %}">Habilidades</a>
        <a class="btn btn-outline-primary" href="{% url 'fichas:ler' ficha.id 'inventario' %}">Inventário</a>
        <a class="btn btn-outline-primary" href="{% url 'fichas:ler' ficha.id 'detalhes' %}">Detalhes</a>
      </div>
      <div class="top">
        <div class="image-wrapper">
          <img src="{{ ficha.foto_personagem.url }}" data-save="foto_personagem" class="photo" id="charImage" alt="Foto do personagem">
          {% if pode_editar %}
            <input type="file" id="imageInput" accept="image/*" hidden data-save="foto_personagem" class="foto">
          {% endif %} 
        </div>
        <div class="info">
          <div class="name-row">
            <input class="editable name" disabled value="{{ ficha.personagem }}" data-save="personagem">
            {% if pode_editar %}
                <button class="edit-icon" id="editBtn" onclick="editar()">
                    <i class="bi bi-pencil-square"></i>
                </button>
            {% endif %} 
          </div>
          <div class="level">
            <span title="Nex">Nex</span><input class="editable" disabled value="{{ ficha.nex }}" data-save="nex" style="width: 30px;">% &nbsp&nbsp&nbsp&nbsp
            Classe:<input class="editable" disabled style="width:80px; font-size: 14px; text-align: left;" value="{{ ficha.classe }}" data-save="classe">    
          </div>
          <div class="level">
            Trilha:<input class="editable" disabled style="width:80px; font-size: 14px; text-align: left;" value="{{ ficha.trilha }}" data-save="trilha">
            Origem:<input class="editable" disabled style="width:89px; font-size: 14px; text-align: left;" value="{{ ficha.origem }}" data-save="origem">
          </div>
        </div>
      </div>
    </header>

    <div>
      <h2>Anotações:</h2> 
      <textarea class="editable" disabled data-save="anotacoes">{{ ficha.anotacoes }}</textarea>
      <h2>Aparência:</h2>
      <textarea class="editable" disabled data-save="aparencia">{{ ficha.aparencia }}</textarea>
      <h2>História:</h2>
      <textarea class="editable" disabled data-save="historia">{{ ficha.historia }}</textarea>
    </div>

    <div style="text-align: center;">
      <div class="image-wrapper">
        <img src="{{ ficha.token_personagem.url }}" class="image" id="detailImage" data-save="token_personagem" alt="Token do personagem">
        {% if pode_editar %}
          <input type="file" id="detailImageInput" accept="image/*" hidden data-save="token_personagem" class="foto">
        {% endif %}
      </div>
    </div>
  </div>

</body>
</html>
