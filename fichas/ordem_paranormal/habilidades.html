<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% load static %}
  <link rel="icon" type="image/x-icon" href="{% static 'img/d20hub.ico' %}">
  <title>D20HUB</title>

  <!--bootstrap css-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  
  <!--bootstrap icons-->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <!--arquivo css-->
  <link rel="stylesheet" href="{% static 'css/ficha.css' %}?v=1.1">

  <!--bootstrap javascript-->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

  <!--javascript ficha-->
  <script src="{% static 'js/ficha.js' %}?v=1.10" defer></script>

  <script>
    window.csrftoken = '{{ csrf_token }}';
  </script>
</head>

<body>
<div class="sheet" data-id="{{ ficha.id }}">
  <header>
    <div style="margin-bottom: 10px; text-align: center;">
        <a class="btn btn-outline-primary" href="{% url 'fichas:ler' ficha.id 'ficha' %}">Ficha</a>
        <a class="btn btn-outline-primary" href="{% url 'fichas:ler' ficha.id 'pericias' %}">Pericias</a>
        <a class="btn btn-outline-primary" href="{% url 'fichas:ler' ficha.id 'habilidades' %}">Habilidades</a>
        <a class="btn btn-outline-primary" href="{% url 'fichas:ler' ficha.id 'inventario' %}">Inventário</a>
        <a class="btn btn-outline-primary" href="{% url 'fichas:ler' ficha.id 'detalhes' %}">Detalhes</a>
      </div>
    <div class="top">
      <div class="image-wrapper">
        <img src="{{ ficha.foto_personagem.url }}" data-save="foto_personagem" class="photo" id="charImage" alt="Foto do personagem">
        {% if pode_editar %}
          <input type="file" id="imageInput" accept="image/*" hidden data-save="foto_personagem" class="foto">
        {% endif %} 
      </div>
      <div class="info">
        <div class="name-row">
          <input class="editable name" disabled value="{{ ficha.personagem }}" data-save="personagem">
          {% if pode_editar %}
              <button class="edit-icon" id="editBtn" onclick="editar()">
                  <i class="bi bi-pencil-square"></i>
              </button>
          {% endif %} 
        </div>
        <div class="level">
          <span title="Nex">Nex</span><input class="editable" disabled value="{{ ficha.nex }}" data-save="nex" style="width: 30px;">% &nbsp&nbsp&nbsp&nbsp
          Classe:<input class="editable" disabled style="width:80px; font-size: 14px; text-align: left;" value="{{ ficha.classe }}" data-save="classe">    
        </div>
        <div class="level">
          Trilha:<input class="editable" disabled style="width:80px; font-size: 14px; text-align: left;" value="{{ ficha.trilha }}" data-save="trilha">
          Origem:<input class="editable" disabled style="width:89px; font-size: 14px; text-align: left;" value="{{ ficha.origem }}" data-save="origem">
        </div>
      </div>
    </div>
  </header>

  <div class="section">
    <div>
      <div class="item-row"  style="width:85%; margin-left: 15px; text-align: center;">
        <h2 title="Nome da habilidade">Habilidade</h2>
          <h2 title="Custo para ativar a habilidade, geralmente pago em PE (Pontos de Esforço) ou PD (Pontos de Determinação)">Custo</h2>
          <h2 title="Página do livro de regras em que é possivel encontrar uma descrição detalhada da habilidade">Página</h2>
      </div> 
      <div class="accordion accordion-custom" id="accordionExample">
        {% for habilidade in ficha.habilidades.all %}
        <div class="accordion accordion-custom" id="accordionHabilidades">
          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#habilidade{{ habilidade.id }}">
                <div class="item-row" style="width:100%; display: flex; gap: 10px;">
                  <input id="nome-{{ habilidade.id }}" class="editable habilidade" disabled value="{{ habilidade.nome }}" data-save="nome" data-habilidade-id="{{ habilidade.id }}">
                  <input id="custo-{{ habilidade.id }}" class="editable habilidade" disabled value="{{ habilidade.custo }}" data-save="custo" data-habilidade-id="{{ habilidade.id }}">
                  <input id="pagina-{{ habilidade.id }}" class="editable habilidade" disabled value="{{ habilidade.pagina }}" data-save="pagina" data-habilidade-id="{{ habilidade.id }}">
                </div>
              </button>
            </h2>
            <div id="habilidade{{ habilidade.id }}" class="accordion-collapse collapse" data-bs-parent="#accordionHabilidades">
              <div class="accordion-body">
                <textarea id="descricao-{{ habilidade.id }}" class="editable habilidade" disabled placeholder="Descrição da habilidade" data-save="descricao" data-habilidade-id="{{ habilidade.id }}">{{ habilidade.descricao }}</textarea>
                <button class="remove-item" data-habilidade-id="{{ habilidade.id }}" onclick="remover('habilidade', '{{ habilidade.id }}')">
                  Remover habilidade
                </button>
              </div>
            </div>
          </div>
        </div>
        {% endfor %}
      </div>
    </div>
    <button class="edit-btn" id="addHabBtn" onclick="adicionar('habilidade')">Adicionar Habilidade</button>
    
  </div>
</div>

</body>
</html>
